name: Import project files

on:
  push:
    paths:
      - ".github/workflows/import-project-files.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio repository
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Check out source coursework repository
        uses: actions/checkout@v4
        with:
          repository: eren-onat/Math440
          ref: main
          path: source

      - name: Copy project files
        shell: bash
        run: |
          set -euo pipefail
          cp "source/Final proj/Onat_Eren_FinalProject.ipynb" "destination/dungeness_crab_biomass_modeling.ipynb"
          mkdir -p "destination/data"
          cp "source/Final proj/DS14.csv" "destination/data/DS14.csv"
          rm -f "destination/.github/workflows/import-project-files.yml"

      - name: Commit imported files
        working-directory: destination
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Dungeness crab biomass analysis and data"
          git push
