name: Import portfolio project

on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio repository
        uses: actions/checkout@v4

      - name: Check out source coursework
        uses: actions/checkout@v4
        with:
          repository: eren-onat/Math440
          path: source-math440

      - name: Copy project files and clean notebook outputs
        shell: bash
        run: |
          mkdir -p figures data
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('source-math440/Final proj/Onat_Eren_FinalProject.ipynb')
          dst = Path('dungeness_crab_biomass_modeling.ipynb')

          nb = json.loads(src.read_text(encoding='utf-8'))
          for cell in nb.get('cells', []):
              if cell.get('cell_type') == 'code':
                  cell['outputs'] = []
                  cell['execution_count'] = None
              source = cell.get('source', [])
              cell['source'] = [
                  line.replace("DATA_FILE = 'DS14.csv'", "DATA_FILE = 'data/DS14.csv'")
                  for line in source
              ]
          dst.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          cp 'source-math440/Final proj/DS14.csv' data/DS14.csv
          cp 'source-math440/Final proj/raw_data.png' figures/raw_data.png
          cp 'source-math440/Final proj/residuals_all_models.png' figures/residuals_all_models.png
          cp 'source-math440/Final proj/step4_holdout.png' figures/holdout_validation.png
          cp 'source-math440/Final proj/step5_forecast.png' figures/forecast.png
          cp 'source-math440/Final proj/super_plot.png' figures/model_comparison.png
          cp 'source-math440/Final proj/top_candidate_model.png' figures/top_candidate_model.png
          rm -rf source-math440

      - name: Commit imported project files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dungeness_crab_biomass_modeling.ipynb data figures
          if ! git diff --cached --quiet; then
            git commit -m 'Add cleaned modeling notebook, data, and figures'
            git push
          fi
