name: Clean notebook wording

on:
  push:
    paths:
      - ".github/workflows/clean-notebook-language.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean notebook text and comments
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          notebook_path = Path("dungeness_crab_biomass_modeling.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))

          intro = (
              "# Dungeness Crab Biomass Modeling\n\n"
              "For my MATH 440 final project, I compared five discrete population models "
              "against a Dungeness crab cohort biomass data set. I fit each model, compared "
              "the fits with residuals and AICc, and used the leading model for a short forecast."
          )

          markdown_replacements = {
              "Imports and Global Settings": "## Imports",
              "Data and Configuration": "## Load the data",
              "Step 2. Analyze (Raw data plot)": "## Plot the data",
              "Model functions": "## Candidate models",
              "Step 4. Validate and Select": "## Compare the models",
              "Figure 4: Residual Plots": "### Residuals",
              "Figure 5: Best-fitting model": "### Best-fitting model",
          }

          exact_code_replacements = {
              "# Use Numpy's modern RNG (for the bootstrap in Step 5)": "# Reproducible random generator for the bootstrap",
              "# Golden-ratio figure dimensions (inches)": "# Plot size",
              "# Specify font size and figure quality for all figures": "",
              "# Load your data": "# Load the data",
              "DATA_FILE = 'data/DS14.csv' # update to your assigned dataset": "DATA_FILE = 'data/DS14.csv'",
              "# Fixed parameters from scenario card.": "# Fixed exponent for the theta-Ricker model",
              "print(\"Column names: \", df.columns.tolist()) # shows the actual column names": "print(\"Column names: \", df.columns.tolist())",
              "print(df.head()) # quick sanity check": "print(df.head())",
              "# Raw Data Plot": "# Plot the observed biomass",
              "# Fit all 5 models using curve_fit": "# Fit all five models",
              "# Improved initial guesses and bounds for better fit": "# Initial guesses and parameter bounds",
              "print('Model Fits Summary (Improved):')": "print('Model fit summary:')",
              "# Figure 2: Super Plot - All 5 Models Overlaid": "# Compare the five fitted models",
              "# Plot observed data": "",
              "# Plot all 5 model fits": "# Fitted curves",
              "# Residuals for all five models (3x2 grid)": "# Residuals for all five models",
              "# Hide the unused subplot if present": "# Hide the unused panel",
              "# Compute for all 5 models": "# Compute AICc for each model",
              "# Identify best model": "# Model with the lowest AICc",
              "print(f'✓ BEST MODEL: {best_model}')": "print(f'Best model: {best_model}')",
              "# Set these variables to the winning model (Beverton-Holt)": "# Beverton-Holt had the lowest AICc",
              "# Step 5: Forecasting with the winning model (simulate from last observed value)": "# Forecast with the fitted Beverton-Holt model",
              "winning_model = model3_beverton_holt  # Beverton-Holt is the winner": "winning_model = model3_beverton_holt",
              "cov_w = cov_3  # covariance matrix ": "cov_w = cov_3",
              "# Future time grid": "# Future time points",
              "# Helper: simulate Beverton-Holt forward from a given starting value": "# Simulate Beverton-Holt forward from a starting value",
              "# Generate bootstrap samples of parameters": "# Sample parameter values from the fitted covariance matrix",
              "# Simulate each draw N_FORECAST forward starting from last observed value": "# Run a forecast for each parameter draw",
              "# 95% CI": "# 95% interval",
              "# Fitted series across observed times (used for plotting the fitted curve)": "# Fitted values over the observed time range",
              "# Deterministic forecast from fitted params starting at last observed": "# Forecast from the fitted parameters",
              "# Figure: 12-Step Forecast with 95% CI": "# Plot the forecast",
              "# Summary statistics": "# Forecast summary",
              "print('  (> 20–30% = poorly constrained forecast)')": "",
              "# predict on test set": "# Predict the holdout points",
              "# Determine holdout winner (lowest MSE)": "# Model with the lowest holdout MSE",
              "print(f'✓ HOLDOUT WINNER: {WINNING_MODEL} (MSE = {holdout_mse[WINNING_MODEL][1]:.3f})')": "print(f'Holdout winner: {WINNING_MODEL} (MSE = {holdout_mse[WINNING_MODEL][1]:.3f})')",
              "# Holdout visualisation for the winning model": "# Plot the holdout comparison",
              "# Shows training data, test data, and the model curve fitted on training only,": "",
              "# with a vertical dashed line at the 80/20 boundary.": "",
              "# Map model names to functions": "",
              "# full series predicted using parameters fitted on training set": "# Prediction using the training-set parameters",
          }

          save_replacements = {
              "plt.savefig('raw_data.png')": "plt.savefig('figures/raw_data.png', bbox_inches='tight')",
              "plt.savefig('super_plot.png', bbox_inches='tight', dpi=300)": "plt.savefig('figures/model_comparison.png', bbox_inches='tight', dpi=300)",
              "print('Saved: super_plot.png')": "print('Saved: figures/model_comparison.png')",
              "plt.savefig('residuals_all_models.png', bbox_inches='tight')": "plt.savefig('figures/residuals_all_models.png', bbox_inches='tight')",
              "print('Saved: residuals_all_models.png')": "print('Saved: figures/residuals_all_models.png')",
              "plt.savefig('top_candidate_model.png', bbox_inches='tight')": "plt.savefig('figures/top_candidate_model.png', bbox_inches='tight')",
              "print('Saved: top_candidate_model.png')": "print('Saved: figures/top_candidate_model.png')",
              "plt.savefig('step5_forecast.png', bbox_inches='tight')": "plt.savefig('figures/forecast.png', bbox_inches='tight')",
              "plt.savefig('step4_holdout.png', bbox_inches='tight')": "plt.savefig('figures/holdout_validation.png', bbox_inches='tight')",
              "print('Saved: step4_holdout.png')": "print('Saved: figures/holdout_validation.png')",
          }

          first_markdown = True
          for cell in notebook.get("cells", []):
              cell["execution_count"] = None if cell.get("cell_type") == "code" else cell.get("execution_count")
              if cell.get("cell_type") == "code":
                  cell["outputs"] = []

              source = "".join(cell.get("source", []))

              if cell.get("cell_type") == "markdown":
                  if first_markdown:
                      source = intro
                      first_markdown = False
                  elif "Parametric Bootstrap Forecast" in source:
                      source = (
                          "### Bootstrap forecast\n\n"
                          "I extended the Beverton-Holt model 12 time steps beyond the data. "
                          "The interval comes from 1,000 parameter samples drawn from the fitted covariance matrix."
                      )
                  elif "Bonus: Holdout MSE" in source:
                      source = (
                          "## Holdout comparison\n\n"
                          "I fit each model on the first 80% of the time series and compared its "
                          "mean squared error on the remaining 20%."
                      )
                  elif "Step 5. Interpret and Forecast" in source:
                      source = "## Forecast"
                  else:
                      for old, new in markdown_replacements.items():
                          if old in source:
                              source = new
                              break

                      lines = []
                      for line in source.splitlines():
                          stripped = line.strip()
                          if stripped in {"---", "***", "___"}:
                              continue
                          if "scenario card" in stripped.lower():
                              continue
                          if stripped.startswith("Parameter interpretation and the Limitations discussion belong entirely"):
                              continue
                          line = re.sub(r"^(#{2,4}\s*)Step\s+\d+[a-z]?[\.:]?\s*", r"\1", line)
                          line = re.sub(r"\s*\*\((?:bonus,\s*)?\+?\d+\s*pts\)\*", "", line, flags=re.I)
                          lines.append(line)
                      source = "\n".join(lines).strip()

                      if "### AICc values" in source:
                          source = source.replace(
                              "$k=$ number of **fitted** parameters only.  Fixed parameters printed as numbers on your scenario card do **not** count.",
                              "$k$ is the number of fitted parameters."
                          )

              elif cell.get("cell_type") == "code":
                  new_lines = []
                  for line in source.splitlines():
                      if line.strip() == "from scipy.integrate import solve_ivp":
                          continue
                      if line.strip() == "C_FIXED     = None":
                          continue
                      if re.match(r"^\s*#\s*-{2,}.*-{2,}\s*$", line):
                          text = re.sub(r"^\s*#\s*-{2,}\s*|\s*-{2,}\s*$", "", line).strip()
                          line = f"# {text}" if text else ""
                      stripped = line.strip()
                      if stripped in exact_code_replacements:
                          indent = line[: len(line) - len(line.lstrip())]
                          replacement = exact_code_replacements[stripped]
                          line = indent + replacement if replacement else ""
                      if line.strip() in save_replacements:
                          indent = line[: len(line) - len(line.lstrip())]
                          line = indent + save_replacements[line.strip()]
                      if line:
                          new_lines.append(line.rstrip())
                  source = "\n".join(new_lines).rstrip()

              cell["source"] = [line + "\n" for line in source.splitlines()]
              if cell["source"]:
                  cell["source"][-1] = cell["source"][-1].rstrip("\n")

          notebook_path.write_text(
              json.dumps(notebook, indent=1, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit notebook cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dungeness_crab_biomass_modeling.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Clean up notebook wording and comments"
            git push
          fi
